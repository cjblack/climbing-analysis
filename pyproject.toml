[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neurokinematics"
version = "0.1.0"
description = "Pipeline for analysing extracellular electrophysiology with freely-moving behaviour"
authors = [
    {name = "Christopher Black", email = "chris.black@ucl.ac.uk"}
]
license = "MIT"

readme = "README.md"
requires-python = ">3.11"

dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "h5py",
    "pyyaml"
]

[project.scripts]
nk-gui = "neurokinematics.gui.app:launch"

[tool.setuptools.packages.find]
where = ["."]
include = ["neurokinematics*"]

[tool.setuptools.package-data]
"neurokinematics.gui" = ["assets/*.png", "assets/*.ico"]
# Simple preprocessing config file, only fills missing vals
pose_format:
  tracker: 'sleap'
  file_format: 'h5'
  frame_rate: 200.
  metadata:
    source: 'filename' # 'filename' | 'manifest' | 'sidecar' | 'custom'
    pattern: '(?P<Id>[^_]+)_(?P<Type>[^_]+)_(?P<Date>\d{8})_T(?P<Trial>\d+)' # regex format for filename
# MANIFEST
# source: 'manifest'
# path: 'pose/manifest.csv' # columns: file, Id, Type, Date, Trial
# key: 'file'

# SIDECAR
# source: 'sidecar'
# suffix: '.meta.yml'

# CUSTOM
# add a custom formatting for metadata - see neurokinematics/pose/metadata.py for creating function

pose_preprocessing:
  fill_missing: true
  # Max gap (in frames) to interpolate across. Gaps longer than this are left as
  # NaN rather than fabricated into a straight line, so long dropouts propagate
  # downstream as missing data. null = interpolate every gap (original behaviour).
  # e.g. at 200 fps, 20 frames = 100 ms.
  max_gap: null
  confidence:
    enabled: false
    thresh: 0.7
  velocity:
    enabled: false
    thresh: 20
post_processing:
  storage_format: 'csv' # right now this isn't doing much as data is stored as csv by default
movement_detection:
  enabled: true
  sort_cols:
    - 'Trial'
    - 'Date'
    - 'frame_id'
  group_cols:
    - 'Trial'
    - 'Date'
  node_list:
    - 'r_forepaw'
    - 'l_forepaw'
    - 'r_hindpaw'
    - 'l_hindpaw'